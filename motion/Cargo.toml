[package]
name = "koubou-motion"
version = "0.1.0"
edition = "2021"
description = "koubou motion: video timeline (.kmotion) — tracks, clips, trims, transitions, keyframes, ffmpeg render"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
fontdue = "0.9"
fontdb = "0.23"
log = "0.4"
