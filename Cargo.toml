[workspace]
resolver = "2"
members = ["cli", "composer", "motion", "pages"]

[workspace.dependencies]
# engine lives in araware — Koubou tracks its work branch; `cargo update -p
# araware-core` pulls new engine work (recipe/decode changes included)
koubou-core = { package = "araware-core", git = "https://github.com/RTCK-DEV/araware", branch = "devin/initial-implementation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
